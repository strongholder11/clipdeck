name: Windows

# Compila o ClipDeck para Windows e monta o instalador.
#
# Existe porque o desenvolvimento acontece num Mac: o WiX só roda no Windows, e
# um MSI montado fora dele seria construído sobre comportamento que o próprio
# WiX declara indefinido. Aqui ele é montado na plataforma certa.

# Sem filtro de caminho: com 'paths' ligado, um push de tag pode não disparar
# nada, e a Release sairia sem instalador — falha silenciosa justamente no
# momento em que alguém está esperando o download.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    # Necessário para anexar o instalador à Release. O token do workflow é
    # somente leitura por padrão, e sem isso o upload falha com 403 — depois
    # de o build inteiro ter passado.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Testes da lógica
        working-directory: windows
        run: dotnet test --nologo --verbosity minimal

      - name: Publicar executável
        working-directory: windows
        run: >
          dotnet publish src/ClipDeck.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o publish/win-x64

      - name: Remover símbolos das bibliotecas nativas
        working-directory: windows
        shell: pwsh
        run: Remove-Item publish/win-x64/*.pdb -ErrorAction SilentlyContinue

      # WiX v5: MIT. O v6 e o v7 passaram a exigir uma licença paga (OSMF).
      - name: Instalar WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2

      - name: Montar o MSI
        working-directory: windows
        run: >
          wix build installer/ClipDeck.wxs
          -bindpath publish=publish/win-x64
          -arch x64
          -ext WixToolset.Util.wixext
          -o installer/ClipDeck-Instalador.msi

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: ClipDeck-Windows
          path: |
            windows/installer/ClipDeck-Instalador.msi
            windows/publish/win-x64/ClipDeck.exe
          if-no-files-found: error

      # Numa tag de versão, o instalador vai direto para a Release.
      #
      # Artefato de Actions não serve para quem só quer instalar: exige entrar na
      # aba Actions, abrir a execução certa e achar "Artifacts". A Release aparece
      # na página inicial do repositório, com um link direto.
      - name: Anexar o instalador à Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: gh release upload ${{ github.ref_name }} windows/installer/ClipDeck-Instalador.msi --clobber
        env:
          GH_TOKEN: ${{ github.token }}
